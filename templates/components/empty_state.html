{# Params: icon, title, message, action_url, action_label #}
<div class="empty-state">
  <div class="icon-tile"><i class="bi bi-{{ icon|default:'inbox' }}"></i></div>
  <h3>{{ title|default:"Nothing here yet" }}</h3>
  {% if message %}<p class="mb-3">{{ message }}</p>{% endif %}
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-primary">{{ action_label|default:"Get started" }}</a>{% endif %}
</div>
