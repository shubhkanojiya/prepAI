{% extends "accounts/_auth_layout.html" %}
{% block title %}Password reset · {{ SITE_NAME }}{% endblock %}
{% block auth_title %}All set!{% endblock %}
{% block auth_body %}
<div class="text-center">
  <i class="bi bi-check-circle fs-1 tone-good"></i>
  <p class="mt-2">Your password has been reset. You can now log in with your new password.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary">Login</a>
</div>
{% endblock %}
